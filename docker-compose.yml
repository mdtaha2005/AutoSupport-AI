version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ticket_system_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: customer_tickets_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_tickets_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  nlp_service:
    build:
      context: ./services/nlp-service
      dockerfile: Dockerfile
    container_name: ticket_nlp_microservice
    restart: unless-stopped
    environment:
      NLP_SERVICE_PORT: 8000
      CONFIDENCE_THRESHOLD: 0.60
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/nlp/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ticket_system_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
